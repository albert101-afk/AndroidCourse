[versions]
navigation-compose = "2.8.0"
kotlin = "2.4.0"
androidx-activity = "1.13.0"
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"

#Compose
compose-core = "1.11.3"
compose-material3 = "1.4.0"
foundationLayout = "1.11.3"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity" ,version.ref = "androidx-activity"}
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose" ,version.ref = "androidx-activity"}
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

#Compose
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-core"}
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3"}
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-core"}
compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-core" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-core"}
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "foundationLayout" }


[bundles]
compose-core = ["compose-foundation", "compose-ui", "compose-ui-preview", "compose-material3", "compose-runtime"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

